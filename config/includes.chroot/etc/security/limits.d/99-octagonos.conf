# OctagonOS Performance Limits

# Real-time priority for audio (PipeWire)
@audio   -  rtprio     95
@audio   -  memlock    unlimited
@audio   -  nice       -19

# Gaming performance
*        -  nofile     1048576
*        soft nofile   524288
*        -  memlock    unlimited

# Allow nice priorities for desktop users
*        soft nice     -5
*        hard nice     -15
