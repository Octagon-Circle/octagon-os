# ═══════════════════════════════════════════════════════════════════════════════
#  ⬡ OctagonOS — Hyprland Configuration
#  Dynamic tiling Wayland compositor tuned for ultra-low latency and gaming
# ═══════════════════════════════════════════════════════════════════════════════

# --- Monitors ---
# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,1

# --- Autostart Applications & Daemons ---
exec-once = waybar &
exec-once = mako &
exec-once = swaybg -c "#070711" &
exec-once = /usr/lib/x86_64-linux-gnu/libexec/polkit-kde-authentication-agent-1 &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = wl-paste --type text --watch cliphist store &
exec-once = wl-paste --type image --watch cliphist store &

# First-run welcome & CachyOS-style Hello Center
exec-once = octagonos-hello &
exec-once = sh -c 'if [ ! -f "$HOME/.config/octagonos-hypr-welcomed" ]; then xdg-open /usr/share/octagonos/octagonos-welcome.html && touch "$HOME/.config/octagonos-hypr-welcomed"; fi'

# --- Environment Variables ---
env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1

# --- Input Configuration ---
input {
    kb_layout = es,us
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification (raw input for gaming)
    accel_profile = flat # Flat acceleration curve preferred by competitive gamers

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# --- General Appearance & Colors ---
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    # OctagonOS signature neon gradient: Cyan to Purple
    col.active_border = rgba(00d4ffee) rgba(7b2ff7ee) 45deg
    col.inactive_border = rgba(191c30aa)

    layout = dwindle
    allow_tearing = true # Allows tearing in full-screen games for absolute zero-latency
}

# --- Decorations (Blur, Shadow, Rounding) ---
decoration {
    rounding = 10

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
    }

    drop_shadow = true
    shadow_range = 15
    shadow_render_power = 3
    col.shadow = rgba(00000088)
}

# --- Smooth Animations ---
animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = linear, 0.0, 0.0, 1.0, 1.0

    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 6, default
    animation = borderangle, 1, 8, linear, loop
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
}

# --- Layouts ---
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_is_master = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true # Variable Refresh Rate saves power & GPU cycles
    vrr = 1    # Enable VRR (FreeSync / G-Sync)
}

# --- Window Rules for Gaming & Tools ---
windowrulev2 = immediate, class:^(steam_app_) # Zero latency tearing for Steam games
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(steam)$,title:^(Friends List.*)$
windowrulev2 = float, class:^(lutris)$
windowrulev2 = float, class:^(calamares)$
windowrulev2 = float, title:^(OctagonOS.*)$

# --- Keybindings ---
$mainMod = SUPER

# Applications
bind = $mainMod, Q, exec, kitty || konsole
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, dolphin
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, wofi --show drun --allow-images
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, F, fullscreen, 0

# Octagon GameMode toggle
bind = $mainMod, G, exec, /etc/skel/.config/hypr/scripts/toggle-gamemode.sh

# Screen capture (Grim + Slurp + Swappy)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, S, exec, grim -g "$(slurp)" - | wl-copy

# Lock screen
bind = $mainMod, L, exec, swaylock -c 070711 --ring-color 00d4ff --key-hl-color 7b2ff7

# Focus navigation (VIM keys + Arrow keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# Mouse drag/resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Audio & Media control
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Brightness control
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
