# OctagonOS Performance Tuning
# Optimized for desktop responsiveness + gaming

# --- Virtual Memory ---
vm.swappiness=10                    # Prefer RAM over swap
vm.vfs_cache_pressure=50            # Keep directory/inode caches longer
vm.dirty_ratio=10                   # Max % of RAM for dirty pages before sync
vm.dirty_background_ratio=5         # Start background writeback earlier
vm.dirty_writeback_centisecs=1500   # Writeback interval
vm.page-cluster=0                   # Disable readahead for swap (zram is fast)
vm.min_free_kbytes=65536            # Keep 64MB free for emergencies

# --- Network Performance ---
net.core.netdev_max_backlog=16384
net.core.somaxconn=8192
net.core.rmem_default=1048576
net.core.rmem_max=16777216
net.core.wmem_default=1048576
net.core.wmem_max=16777216
net.core.optmem_max=65536
net.ipv4.tcp_rmem=4096 1048576 2097152
net.ipv4.tcp_wmem=4096 65536 16777216
net.ipv4.tcp_fastopen=3
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_congestion_control=bbr   # Better congestion control
net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_timestamps=0             # Slight performance gain
net.ipv4.tcp_fin_timeout=10
net.ipv4.tcp_tw_reuse=1

# --- Kernel ---
kernel.sched_autogroup_enabled=1      # Better desktop responsiveness
kernel.sched_cfs_bandwidth_slice_us=500
kernel.nmi_watchdog=0                 # Save power/CPU
kernel.unprivileged_userns_clone=1    # For Flatpak/containers
kernel.printk=3 3 3 3                # Reduce console spam

# --- File System ---
fs.inotify.max_user_watches=524288    # For IDEs and file watchers
fs.file-max=2097152
fs.nr_open=1048576

# --- Security (balanced) ---
kernel.kptr_restrict=1
kernel.dmesg_restrict=0               # Allow user to read dmesg
kernel.yama.ptrace_scope=1
net.ipv4.conf.all.rp_filter=1
net.ipv4.conf.default.rp_filter=1
net.ipv4.icmp_echo_ignore_broadcasts=1
